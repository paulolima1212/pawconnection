<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Paw Connection</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        background: #fffdd2;
        color: #332015;
        line-height: 1.55;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      h1 {
        font-family: system-ui, sans-serif;
      }
      label {
        display: block;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        height: 48px;
        padding: 0 12px;
        border: 1px solid #332015;
        border-radius: 10px;
        font-size: 16px;
      }
      button {
        margin-top: 24px;
        width: 100%;
        height: 48px;
        border: 3px solid #332015;
        border-radius: 10px;
        background: #f4c7a8;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .msg {
        margin-top: 16px;
        font-family: system-ui, sans-serif;
      }
      .err {
        color: #b42318;
      }
      a {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a new password</h1>
      <p>Enter a new password for your Paw Connection account. This link expires in 1 hour.</p>
      <form id="form">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password" />
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" minlength="6" required autocomplete="new-password" />
        <button type="submit" id="submit">Update password</button>
      </form>
      <p class="msg" id="status" hidden></p>
      <p><a href="./index.html">Back to Paw Connection</a></p>
    </main>
    <script>
      const API = 'https://paw-backend.lz-plima1212.online';
      const params = new URLSearchParams(window.location.search);
      const token = (params.get('token') || '').trim();
      const form = document.getElementById('form');
      const status = document.getElementById('status');
      const submit = document.getElementById('submit');

      function show(message, isError) {
        status.hidden = false;
        status.textContent = message;
        status.className = 'msg' + (isError ? ' err' : '');
      }

      if (!token) {
        show('This reset link is missing a token. Request a new one from the app.', true);
        submit.disabled = true;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm) {
          show('Passwords do not match.', true);
          return;
        }
        submit.disabled = true;
        show('Updating password…', false);
        try {
          const response = await fetch(API + '/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(body.message || 'Could not reset your password.');
          }
          show(body.message || 'Password updated. You can sign in in the app.', false);
          form.hidden = true;
        } catch (error) {
          show(error instanceof Error ? error.message : 'Could not reset your password.', true);
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
