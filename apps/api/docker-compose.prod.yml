services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: paw-connection-api:latest
    container_name: paw_connection_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DOCKER_DB_HOST_REPLACE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3011:3001"
    volumes:
      - paw_api_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  paw_api_uploads:
